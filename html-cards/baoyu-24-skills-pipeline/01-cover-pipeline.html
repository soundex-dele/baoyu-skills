<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1440">
<title>baoyu 24 技能流水线 - Card 1/7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f0f0f0; }

:root {
    --bg-primary: #FFFFFF;
    --bg-secondary: #F7F6F3;
    --bg-accent: #F0EFEA;
    --text-primary: #37352F;
    --text-secondary: #787774;
    --text-tertiary: #B4B4B0;
    --zone-1: #E8F0FE;
    --zone-2: #FDE8E8;
    --zone-3: #E8F5E9;
    --zone-4: #FFF8E1;
    --accent: #2EAADC;
    --accent-soft: #90CAF9;
    --accent-bg: rgba(46, 170, 220, 0.08);
    --border: #E9E9E7;
    --border-light: #F1F1EF;
    --shadow: rgba(55, 53, 47, 0.06);
    --text-2xl: 52px;
    --text-3xl: 64px;
    --text-4xl: 80px;
    --text-xl: 40px;
    --text-lg: 32px;
    --text-base: 28px;
    --text-sm: 24px;
    --text-xs: 20px;
    --line-height-tight: 1.2;
    --line-height-normal: 1.5;
    --z-background: 0; --z-decoration: 10; --z-content: 20; --z-header: 30; --z-footer: 30;
}

.card {
    position: relative;
    width: 1080px; height: 1440px;
    padding: 60px;
    overflow: hidden;
    font-family: 'Noto Sans SC', "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text-primary);
    background: var(--bg-primary);
    border: 1px solid var(--border);
}
.card::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
    background-size: 24px 24px; opacity: 0.5; z-index: var(--z-background);
}

.card-header { position: relative; z-index: var(--z-header); display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
.card-brand { font-size: 22px; color: var(--text-secondary); font-weight: 500; }
.brand-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); margin-right: 8px; vertical-align: middle; }
.card-page { font-size: 20px; color: var(--text-tertiary); }

.card-content { position: relative; z-index: var(--z-content); display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100% - 120px); text-align: center; gap: 36px; }

.eyebrow { font-size: var(--text-sm); color: var(--accent); font-weight: 500; letter-spacing: 2px; }
.hero-title { font-size: var(--text-4xl); font-weight: 700; color: var(--text-primary); line-height: var(--line-height-tight); }
.hero-title .text-highlight { background: linear-gradient(180deg, transparent 55%, #FFEAA7 55%); padding: 0 6px; }

.num-24 { font-size: 120px; font-weight: 700; color: var(--accent); line-height: 1; letter-spacing: -4px; }
.num-24 .skills-label { font-size: var(--text-lg); color: var(--text-secondary); font-weight: 400; display: block; letter-spacing: 4px; margin-top: 8px; }

.subtitle { font-size: var(--text-base); color: var(--text-secondary); line-height: var(--line-height-normal); max-width: 820px; }

.pills { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 780px; }
.pill { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 100px; padding: 10px 24px; font-size: var(--text-xs); font-weight: 500; }
.pill .arrow { color: var(--accent); margin: 0 6px; }

.card-footer { position: absolute; bottom: 40px; left: 60px; right: 60px; z-index: var(--z-footer); display: flex; justify-content: space-between; align-items: center; }
.footer-note { font-size: 20px; color: var(--text-tertiary); }
</style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <span class="card-brand"><span class="brand-dot"></span>baoyu · 24 skills</span>
    </div>

    <div class="card-content">
        <div class="num-24">24<span class="skills-label">个创作技能</span></div>

        <h1 class="hero-title">把内容生产<br>拆成<span class="text-highlight">一条流水线</span></h1>

        <p class="subtitle">从抓素材、生成内容、配图排版，到一键发布，每一步都有对应技能，每个技能都有一条可以直接说出口的指令。</p>

        <div class="pills">
            <span class="pill">① 采集素材</span>
            <span class="pill"><span class="arrow">→</span> ② 生成内容</span>
            <span class="pill"><span class="arrow">→</span> ③ 配图排版</span>
            <span class="pill"><span class="arrow">→</span> ④ 一键发布</span>
            <span class="pill"><span class="arrow">→</span> ⑤ 兜底工具</span>
        </div>
    </div>

    <div class="card-footer">
        <span class="footer-note">读完即上手 · 每个技能附动作指令</span>
        <span class="card-page">1 / 7</span>
    </div>
</div>
</body>
</html>
